<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>𝑪𝑳𝑶𝑺𝑬 𝑭𝑹𝑰𝑬𝑵𝑫</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #211044, #050509 60%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 430px;
    text-align: center;
}

.logo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 20px;
    box-shadow: 0 0 30px #8b3dff;
}

h1 {
    font-size: 38px;
    margin: 5px 0;
    color: #d7b4ff;
    text-shadow: 0 0 20px #9b4dff;
}

.description {
    color: #aaa;
    margin-bottom: 35px;
}

button {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    border: 1px solid #9b4dff;
    border-radius: 15px;
    background: rgba(120, 40, 255, 0.15);
    color: white;
    font-size: 17px;
    box-shadow: 0 0 15px rgba(140, 60, 255, .4);
}

button:active {
    transform: scale(.97);
}

.footer {
    margin-top: 30px;
    color: #666;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <img src="logo.png" class="logo">

    <h1>𝑪𝑳𝑶𝑺𝑬 𝑭𝑹𝑰𝑬𝑵𝑫</h1>

    <div class="description">
        ศูนย์รวมคลิป18+
    </div>

    <button onclick="discord()">
        💬 ติดต่อ Discord
    </button>

    <button onclick="clips()">
        🎬 เมนูคลิป
    </button>

    <div class="footer">
        © 2026 𝑪𝑳𝑶𝑺𝑬 𝑭𝑹𝑰𝑬𝑵𝑫
    </div>

</div>

<script>

function discord() {
    window.open(
        "https://discord.gg/ใส่ลิงก์ของคุณ",
        "_blank"
    );
}

function clips() {
    alert("กำลังเข้าสู่เมนูคลิป");
}

</script>

</body>
</html>
